<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập · host-a100</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{ font-family:'Inter',system-ui,sans-serif;
      background:linear-gradient(135deg,#0b1220,#111a2e); color:#0f172a;
      min-height:100vh; display:grid; place-items:center; margin:0; }
    .login-card{ background:#fff; border-radius:18px; padding:34px 30px;
      width:min(380px,92vw); box-shadow:0 20px 60px rgba(0,0,0,.35); }
    .logo{ width:48px; height:48px; border-radius:14px; display:grid;
      place-items:center; margin:0 auto 14px;
      background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff;
      font-size:1.5rem; box-shadow:0 8px 20px rgba(99,102,241,.45); }
  </style>
</head>
<body>
  <form class="login-card" method="post" action="{{ url_for('login') }}">
    <div class="logo"><i class="bi bi-gpu-card"></i></div>
    <h1 class="h5 text-center fw-bold mb-1">host-a100</h1>
    <p class="text-center text-muted small mb-4">Nhập mật khẩu để tiếp tục</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <div class="mb-3">
      <input type="password" name="password" class="form-control form-control-lg"
             placeholder="Mật khẩu" autofocus required autocomplete="current-password">
    </div>
    <button class="btn btn-primary w-100 btn-lg">
      <i class="bi bi-box-arrow-in-right"></i> Đăng nhập</button>
  </form>
</body>
</html>
